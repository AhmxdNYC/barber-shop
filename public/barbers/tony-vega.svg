<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="Portrait placeholder">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2E1F2E"/>
      <stop offset="1" stop-color="#150F15"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.34" r="0.5">
      <stop offset="0" stop-color="#9B6E9E" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#9B6E9E" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="400" height="500"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="400" height="500" fill="url(#g)"/>
    <rect width="400" height="500" fill="url(#halo)"/>

    <!-- shoulders -->
    <path d="M 40 500 C 40 372, 120 330, 200 330 C 280 330, 360 372, 360 500 Z"
          fill="#9B6E9E" fill-opacity="0.15"/>
    <!-- head -->
    <circle cx="200" cy="238" r="76" fill="#9B6E9E" fill-opacity="0.19"/>
    <!-- hairline suggestion -->
    <path d="M 128 226 C 132 176, 172 156, 200 156 C 228 156, 268 176, 272 226 C 250 200, 150 200, 128 226 Z"
          fill="#9B6E9E" fill-opacity="0.24"/>

    <text x="200" y="262" text-anchor="middle"
          font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif"
          font-size="62" font-weight="700" letter-spacing="2"
          fill="#F3EFE7" fill-opacity="0.55">TV</text>

    <!-- barber pole mark -->
    <g transform="translate(28 460)">
      <rect width="46" height="5" rx="2.5" fill="#CC4B3C"/>
      <rect x="54" width="22" height="5" rx="2.5" fill="#C9A25E"/>
      <rect x="84" width="22" height="5" rx="2.5" fill="#F3EFE7" fill-opacity="0.28"/>
    </g>
  </g>
</svg>
